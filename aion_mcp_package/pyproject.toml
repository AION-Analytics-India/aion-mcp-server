[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-indian-market-intelligence-mcp"
version = "1.0.6"
description = "Macro Intelligence Server (MCP) for AION IMI: turn event text into structured, explainable macro intelligence through a hosted API."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AION Analytics", email = "contact@aionanalytics.in" }]
dependencies = [
  "aion-indian-market-intelligence>=1.0.8",
  "mcp>=1.27,<2"
]
keywords = [
  "aion",
  "mcp",
  "indian-market-intelligence",
  "sector-impact-analysis",
  "financial-event-intelligence",
  "financial-intelligence",
  "market-intelligence",
  "market-monitoring",
  "fintech-infrastructure",
  "ai-agent-tooling",
  "llm-tools",
  "llm-tool-for-indian-equities",
  "financial-news",
  "indian-stock-market-news-api",
  "nse-sector-impact-api",
  "headline-to-context",
  "event-driven-market-intelligence-india",
  "sector-exposure-api-india",
  "hosted-api-client"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
"Homepage" = "https://aionanalytics.in/models/indian-market-intelligence"
"Documentation" = "https://github.com/AION-Analytics-India/aion-mcp-server#readme"
"Source" = "https://github.com/AION-Analytics-India/aion-mcp-server"
"Issues" = "https://github.com/AION-Analytics-India/aion-mcp-server/issues"
"API access" = "https://aionanalytics.in/apis"


[project.scripts]
aion-indian-market-intelligence-mcp = "aion_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
